name: Weekly benchmark

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark when manually labeled cases exist
        id: benchmark
        shell: bash
        run: |
          if find bench/cases -maxdepth 1 -type f -name '*.json' -print -quit | grep -q .; then
            pnpm build
            node dist/cli/index.js bench bench/cases
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "No manually labeled benchmark cases; skipping."
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload benchmark results
        if: steps.benchmark.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: bench/results/*.json
          if-no-files-found: error
